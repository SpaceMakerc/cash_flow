{% extends 'layout/base.html' %}
{% load rest_framework %}

{% block content %}

<h3><a href="{% url 'add_category_page' %}">Добавить Категорию</a></h3>
<table>
    <caption>Информация по вашим Категориям</caption>
    <thead>
        <tr>
            <th>Номер строки</th>
            <th>Наименование</th>
            <th>Тип</th>
            <th>Изменить</th>
            <th>Удалить</th>
        </tr>
    </thead>
    <tbody>
        {% for data in serializer.data %}
        <tr>
            <td>{{forloop.counter}}</td>
            <td>{{data.name}}</td>
            <td>{{data.type}}</td>
            <td><a href="{% url 'change_category_page' data.id %}"><input type="button" value="V"></a></td>
            <td><a href="{% url 'delete_category_page' data.id %}"><input type="button" value="V"></a></td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock content %}
