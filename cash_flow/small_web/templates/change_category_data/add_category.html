{% extends 'layout/base.html' %}

{% block content %}
<form method="POST">
    {% csrf_token %}
    <div>
        {{ form.name.label_tag }}
        {{ form.name }}
        {{ form.name.errors|first }}
    </div>

    <div>
        {{ form.type.label_tag }}
        {{ form.type }}
        {{ form.type.errors|first }}
    </div>

    <input type="submit" value="Добавить">
</form>
{% endblock %}
