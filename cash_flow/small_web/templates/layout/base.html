<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <title>Движение</title>
    <link rel="stylesheet" type="text/css" href="{% static 'css/style.css' %}">
</head>
<body>
    <header>
        <h1>Движение денежных средств</h1>
    </header>
    <nav>
        <a href="{% url 'index_page' %}">Главная</a>
        <a href="#">Личный кабинет</a>
        <a href="{% url 'signin_page' %}">Вход в систему</a>
        <a href="{% url 'signup_page' %}">Регистрация</a>
        {% if user.is_authenticated %}
        <a href="{% url 'logout_page' %}">Выход из системы</a>
        {% endif %}
    </nav>
    <section>
        {% block content %}
        {% endblock content %}
    </section>
</body>
</html>
